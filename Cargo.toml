[package]
name = "hyprmt"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["nathawat <nathawat@noreply.codeberg.org>"]
description = "Hyprland monitorv2 toggle utility inspired by the Windows + P"
homepage = "https://codeberg.org/nathawat/hyprmt"
documentation = "https://codeberg.org/nathawat/hyprmt/src/branch/main/docs/SUMMARY.md"
readme = "README.md"
repository = "https://codeberg.org/nathawat/hyprmt"
license = "GPL-3.0-or-later"
keywords = ["hyprland", "wayland", "monitor", "display"]
categories = ["command-line-utilities", "gui"]
publish = ["codeberg"]

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
hyprland = { version = "0.4.0-beta.3", default-features = false, features = ["ctl", "data", "keyword"] }
ddc = { version = "0.2", optional = true }
ddc-i2c = { version = "0.2.2", default-features = false, features = ["with-linux-enumerate", "with-linux"], optional = true }
i2c-linux = { version = "0.1.2", features = ["i2c"], optional = true }
directories = { version = "6.0.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
brightstay = ["dep:ddc", "dep:ddc-i2c", "dep:i2c-linux", "dep:directories", "dep:serde"]
