[package]
name = "hyprmt"
version = "3.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["nathawat <nathawat@noreply.codeberg.org>"]
description = "Hyprland monitor toggle utility inspired by the Windows + P"
homepage = "https://codeberg.org/nathawat/hyprmt"
documentation = "https://codeberg.org/nathawat/hyprmt/src/branch/main/docs/SUMMARY.md"
readme = "README.md"
repository = "https://codeberg.org/nathawat/hyprmt"
license = "GPL-3.0-or-later"
keywords = ["hyprland", "wayland", "monitor", "display"]
categories = ["command-line-utilities", "gui"]

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"

[patch.crates-io]
ddc-i2c = { git = "https://github.com/arcnmx/ddc-i2c-rs", branch = "v0.3.x" }
ddc = { git = "https://github.com/arcnmx/ddc-rs", branch = "v0.3.x" }
i2c-linux = { git = "https://github.com/arcnmx/i2c-linux-rs", branch = "v0.2.x" }

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
hyprland = { version = "0.4.0-beta.3", default-features = false, features = ["ctl", "data"] }
ddc = { version = "0.3.0", optional = true }
ddc-i2c = { version = "0.3.0", default-features = false, features = ["enumerate", "i2c-linux"], optional = true }
i2c-linux = { version = "0.2.0", features = ["i2c"], optional = true }

[features]
brightstay = ["dep:ddc", "dep:ddc-i2c", "dep:i2c-linux"]
