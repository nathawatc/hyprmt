[package]
name = "hyprmt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["nathawat <nathawat@noreply.codeberg.org>"]
description = "Hyprland monitorv2 toggle utility inspired by the Windows + P"
homepage = "https://codeberg.org/nathawat/hyprmt"
documentation = "https://codeberg.org/nathawat/hyprmt/src/branch/main/docs/SUMMARY.md"
readme = "README.md"
repository = "https://codeberg.org/nathawat/hyprmt"
license = "GPL-3.0-or-later"
keywords = ["hyprland", "wayland", "monitor", "display"]
categories = ["command-line-utilities", "gui"]
publish = ["codeberg"]

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
hyprland = { version = "0.4.0-beta.3", default-features = false, features = ["ctl", "data", "keyword"] }
